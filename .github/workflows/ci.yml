name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    # The lock that keeps seq unique is flock, so the tool is Unix-only by
    # design (internal/flock). Both supported platforms get exercised rather
    # than assumed.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - name: Check formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "gofmt needed on:"; echo "$unformatted"; exit 1
          fi

      - name: Check go.mod is tidy
        run: |
          go mod tidy
          # The `--` matters: it makes these pathspecs, so the missing go.sum of a
          # dependency-free module matches nothing instead of exiting 128 and
          # reporting a tidy module as untidy.
          git diff --exit-code -- go.mod go.sum || {
            echo "go.mod or go.sum is not tidy; run 'go mod tidy' and commit"; exit 1; }

      - run: go vet ./...

      - name: Test with the race detector
        run: go test -race ./...

      # The M1 and M2 done-conditions are cross-process and cross-worktree, so
      # they cannot run under `go test`. This script builds a scratch repository
      # and checks them for real.
      - name: Verify milestone conditions
        run: |
          git config --global user.email ci@example.com
          git config --global user.name ci
          make check

      - name: Cross-compile the supported platforms
        if: matrix.os == 'ubuntu-latest'
        run: |
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64; do
            GOOS=${target%/*} GOARCH=${target#*/} go build -o /dev/null ./cmd/adrlog
            echo "  built $target"
          done

  lint-records:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - run: make install

      # An unreadable record is a defect, and a stale index hides records from
      # every reader. Both fail the build.
      - name: Lint the decision records
        run: .claude/bin/adrlog lint

      - name: Check the index is current
        run: |
          .claude/bin/adrlog index
          git diff --exit-code docs/adr/README.md || {
            echo "docs/adr/README.md is stale; run 'adrlog index' and commit"; exit 1; }
